name: Build Windows EXE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Python source
        shell: powershell
        run: |
          python -m py_compile screen_image_monitor.py

      - name: Build EXE
        shell: powershell
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --noupx `
            --name ScreenImageMonitor `
            --collect-all numpy `
            --collect-all cv2 `
            --collect-all PIL `
            --hidden-import mss.windows `
            --hidden-import tkinter `
            screen_image_monitor.py

      - name: Prepare package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path package -Force

          Copy-Item dist\ScreenImageMonitor.exe package\
          Copy-Item config.json package\ -ErrorAction SilentlyContinue
          Copy-Item README.md package\ -ErrorAction SilentlyContinue

          $folders = @(
            "templates",
            "samples",
            "sounds",
            "evidence",
            "tesseract"
          )

          foreach ($folder in $folders) {
            if (Test-Path $folder) {
              Copy-Item $folder "package\$folder" -Recurse -Force
            }
          }

          Write-Host "Package contents:"
          Get-ChildItem package -Recurse

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ScreenImageMonitor-Windows
          path: package
          if-no-files-found: error
          retention-days: 14
